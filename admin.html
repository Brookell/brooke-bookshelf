<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#c2a5f9" />
  <title>Reading Room Admin</title>
  <link rel="stylesheet" href="./admin.css?v=20261117-5" />
  <script src="./config.js"></script>
  <script>
    if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      document.write('<script src="./config.local.js"><\/script>');
    }
  </script>
  <script defer src="./code-slots.js?v=20261117-1"></script>
  <script defer src="./admin.js?v=20261117-11"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">R</span>
        <div>
          <strong>Reading Room</strong>
          <small>管理后台</small>
        </div>
      </div>
      <nav class="nav" aria-label="后台导航">
        <a href="#overview" class="is-active"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>概览</span></a>
        <a href="#traffic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>访问与注册</span></a>
        <a href="#users"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.5 3.5 5.2"/></svg><span>用户</span></a>
        <a href="#content"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>书籍与搜索</span></a>
      </nav>
      <a class="sidebar-card" href="./" target="_blank" rel="noopener">
        <span>打开网站</span>
        <small>去 Reading Room 看看</small>
      </a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="greeting">欢迎回来</h1>
          <p class="muted" id="today"></p>
        </div>
        <div class="topbar-actions" id="headerActions" hidden>
          <span class="chip" id="signedInAs"></span>
          <button type="button" id="refreshButton">刷新</button>
          <button type="button" id="signOutButton">退出</button>
        </div>
      </header>

      <section class="state" id="loadingPanel">
        <p>正在读取数据…</p>
        <div class="bar" aria-hidden="true"><i></i></div>
      </section>

      <section class="state card" id="signInPanel" hidden>
        <h2>管理员登录</h2>
        <form id="signInForm" class="sign-in">
          <label for="signInPasscode">密码</label>
          <input id="signInPasscode" type="password" autocomplete="current-password" inputmode="numeric" />
        </form>
        <p class="muted" id="signInNote" role="status"></p>
      </section>

      <section class="state card" id="deniedPanel" hidden>
        <h2>没有访问权限</h2>
        <p class="muted" id="deniedText">当前账号不是管理员。</p>
      </section>

      <div id="dashboard" hidden>
        <section class="kpis" id="overview" aria-label="关键数据"></section>

        <div class="grid">
          <section class="card span-2" id="traffic">
            <div class="card-head">
              <h2>访问与注册 <small>最近 30 天</small></h2>
              <div class="legend">
                <span><i class="dot visitors"></i>访客</span>
                <span><i class="dot signups"></i>注册</span>
              </div>
            </div>
            <div class="chart" id="trafficChart"></div>
          </section>

          <section class="card">
            <div class="card-head"><h2>使用情况</h2></div>
            <ul class="usage" id="usageList"></ul>
          </section>

          <section class="card span-2" id="users">
            <div class="card-head">
              <h2>用户 <small id="userCount"></small></h2>
              <div class="tools">
                <input type="search" id="userFilter" placeholder="搜索邮箱或房间名" aria-label="搜索用户" />
                <button type="button" id="exportUsers">导出 CSV</button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="table" id="userTable">
                <thead>
                  <tr>
                    <th data-sort="email">邮箱</th>
                    <th data-sort="created_at">注册时间</th>
                    <th data-sort="last_sign_in_at">最后登录</th>
                    <th data-sort="books" class="num">书</th>
                    <th data-sort="weread_connected">微信读书</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </section>

          <div class="stack">
            <section class="card">
              <div class="card-head"><h2>热门搜索 <small>30 天</small></h2></div>
              <ol class="rank" id="searchList"></ol>
            </section>
            <section class="card">
              <div class="card-head"><h2>访问来源 <small>30 天</small></h2></div>
              <ol class="rank" id="referrerList"></ol>
            </section>
          </div>

          <section class="card span-3" id="content">
            <div class="card-head">
              <h2>最常被收藏的书</h2>
              <button type="button" id="exportBooks">导出 CSV</button>
            </div>
            <ul class="covers" id="bookList"></ul>
          </section>
        </div>

        <p class="muted generated" id="generatedAt"></p>
      </div>
    </main>
  </div>
</body>
</html>
