<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#eeece8" />
  <title>Reading Room Admin</title>
  <link rel="stylesheet" href="./admin.css?v=20261117-2" />
  <script src="./config.js"></script>
  <script>
    if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      document.write('<script src="./config.local.js"><\/script>');
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0/dist/umd/supabase.min.js"></script>
  <script defer src="./admin.js?v=20261117-4"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">R</span>
        <div>
          <strong>Reading Room</strong>
          <small>管理后台</small>
        </div>
      </div>
      <nav class="nav" aria-label="后台导航">
        <a href="#overview" class="is-active">概览</a>
        <a href="#traffic">访问与注册</a>
        <a href="#users">用户</a>
        <a href="#content">书籍与搜索</a>
      </nav>
      <a class="sidebar-card" href="./" target="_blank" rel="noopener">
        <span>打开网站</span>
        <small>在新标签页查看 Reading Room</small>
      </a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="greeting">欢迎回来</h1>
          <p class="muted" id="today"></p>
        </div>
        <div class="topbar-actions" id="headerActions" hidden>
          <span class="chip" id="signedInAs"></span>
          <button type="button" id="refreshButton">刷新</button>
          <button type="button" id="signOutButton">退出</button>
        </div>
      </header>

      <section class="state" id="loadingPanel">
        <p>正在读取数据…</p>
        <div class="bar" aria-hidden="true"><i></i></div>
      </section>

      <section class="state card" id="signInPanel" hidden>
        <h2>管理员登录</h2>
        <form id="signInForm" class="sign-in">
          <label for="signInEmail">邮箱</label>
          <input id="signInEmail" type="email" required autocomplete="email" placeholder="you@example.com" />
          <label for="signInPassword">密码</label>
          <input id="signInPassword" type="password" required autocomplete="current-password" />
          <button type="submit">登录</button>
        </form>
        <button type="button" class="link" id="magicLinkButton">没有设置密码？发送登录链接到邮箱</button>
        <p class="muted" id="signInNote" role="status"></p>
      </section>

      <section class="state card" id="deniedPanel" hidden>
        <h2>没有访问权限</h2>
        <p class="muted" id="deniedText">当前账号不是管理员。</p>
      </section>

      <div id="dashboard" hidden>
        <section class="kpis" id="overview" aria-label="关键数据"></section>

        <div class="grid">
          <section class="card span-2" id="traffic">
            <div class="card-head">
              <h2>访问与注册 <small>最近 30 天</small></h2>
              <div class="legend">
                <span><i class="dot visitors"></i>访客</span>
                <span><i class="dot signups"></i>注册</span>
              </div>
            </div>
            <div class="chart" id="trafficChart"></div>
          </section>

          <section class="card">
            <div class="card-head"><h2>使用情况</h2></div>
            <ul class="usage" id="usageList"></ul>
          </section>

          <section class="card span-2" id="users">
            <div class="card-head">
              <h2>用户 <small id="userCount"></small></h2>
              <div class="tools">
                <input type="search" id="userFilter" placeholder="搜索邮箱或房间名" aria-label="搜索用户" />
                <button type="button" id="exportUsers">导出 CSV</button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="table" id="userTable">
                <thead>
                  <tr>
                    <th data-sort="email">邮箱</th>
                    <th data-sort="created_at">注册时间</th>
                    <th data-sort="last_sign_in_at">最后登录</th>
                    <th data-sort="books" class="num">书</th>
                    <th data-sort="weread_connected">微信读书</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </section>

          <div class="stack">
            <section class="card">
              <div class="card-head"><h2>热门搜索 <small>30 天</small></h2></div>
              <ol class="rank" id="searchList"></ol>
            </section>
            <section class="card">
              <div class="card-head"><h2>访问来源 <small>30 天</small></h2></div>
              <ol class="rank" id="referrerList"></ol>
            </section>
          </div>

          <section class="card span-3" id="content">
            <div class="card-head">
              <h2>最常被收藏的书</h2>
              <button type="button" id="exportBooks">导出 CSV</button>
            </div>
            <ul class="covers" id="bookList"></ul>
          </section>
        </div>

        <p class="muted generated" id="generatedAt"></p>
      </div>
    </main>
  </div>
</body>
</html>
